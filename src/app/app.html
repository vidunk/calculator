<router-outlet></router-outlet>

<div class="app" [attr.data-theme]="theme">
  <main class="page">
    <div class="topbar">
      <span class="badge"><i class="dot"></i> Angular · Smart calculator</span>

      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="'Switch to ' + (theme === 'dark' ? 'light' : 'dark') + ' mode'"
      >
        {{ theme === 'dark' ? '☀️ Light' : '🌙 Dark' }}
      </button>
    </div>

    <h1 class="headline">
      Two numbers.<br />
      <span class="green">Eight moves.</span><br />
      <em class="serif">one answer.</em>
    </h1>

    <section class="card">
      <p class="mono-label">◆ Enter values · Pick one</p>

      <form class="fields" (ngSubmit)="calc('add')">
        <div class="field">
          <label for="first" class="mono-label">First value</label>
          <input id="first" name="a" type="number" [(ngModel)]="a" />
        </div>

        <div class="field">
          <label for="second" class="mono-label">Second value</label>
          <input id="second" name="b" type="number" [(ngModel)]="b" />
        </div>

        <div class="ops">
          <button type="button" class="chip" (click)="calc('add')">➕ Add</button>
          <button type="button" class="chip" (click)="calc('sub')">➖ Sub</button>
          <button type="button" class="chip" (click)="calc('mul')">✖️ Mul</button>
          <button type="button" class="chip" (click)="calc('div')">➗ Div</button>
          <button type="button" class="chip" (click)="calc('mod')">Mod</button>
          <button type="button" class="chip" (click)="calc('pow')">xʸ</button>
          <button type="button" class="chip" (click)="calc('pct')" title="A% of B">A% of B</button>
          <button
            type="button"
            class="chip"
            (click)="calc('sqrt')"
            title="Square root of first value"
          >
            √A
          </button>
        </div>

        <div class="actions">
          <button type="button" class="ghost" (click)="swap()">⇄ Swap</button>
          <button type="button" class="ghost" (click)="useResult()">↩ Use result</button>
          <button type="button" class="ghost danger" (click)="clear()">✕ Clear</button>
        </div>
      </form>

      <div class="result" [class.error]="isError">
        <div class="result-head">
          <span class="mono-label">Result</span>
          @if (c !== '' && !isError) {
            <button type="button" class="copy" (click)="copy()">
              {{ copied ? '✓ Copied' : '⧉ Copy' }}
            </button>
          }
        </div>
        <strong>{{ c }}</strong>
      </div>

      @if (history.length) {
        <div class="history">
          <div class="history-head">
            <span class="mono-label">History</span>
            <button type="button" class="copy" (click)="clearHistory()">Clear all</button>
          </div>
          <ul>
            @for (item of history; track $index) {
              <li>
                <button type="button" class="history-item" (click)="reuse(item)">
                  <span class="expr">{{ item.expr }}</span>
                  <span class="eq">= {{ item.result }}</span>
                </button>
              </li>
            }
          </ul>
        </div>
      }
    </section>
  </main>
</div>
